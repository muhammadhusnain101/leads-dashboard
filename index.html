 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    
    <title>Lead Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f6f9;
        }

        .auth-screen[hidden],
        .container[hidden] {
            display: none;
        }

        .auth-card {
            width: min(100%, 400px);
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .auth-card h1 {
            margin-bottom: 8px;
            color: #111827;
            font-size: 28px;
        }

        .auth-card p {
            margin-bottom: 24px;
            color: #6b7280;
        }

        .auth-field {
            display: block;
            margin-bottom: 16px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .auth-field input {
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
            outline: none;
        }

        .auth-field input:focus {
            border-color: #4f46e5;
        }

        .auth-submit,
        .logout-btn {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .auth-submit {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
        }

        .auth-submit:hover {
            background: #4338ca;
        }

        .auth-error {
            min-height: 20px;
            margin: 0 0 12px;
            color: #b91c1c;
            font-size: 13px;
        }

        .logout-btn {
            padding: 10px 14px;
            background: #fee2e2;
            color: #991b1b;
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* CONNECTION STATUS */

        .connection-status {
            display: none;
            padding: 10px 16px;
            border-radius: 20px;
            background: #e5e7eb;
            color: #374151;
            font-size: 14px;
        }

        .connection-status.success {
            background: #dcfce7;
            color: #166534;
        }

        .connection-status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* KPI GRID */

        .kpi-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .kpi-card {
            background: white;

            padding: 24px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .kpi-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 30px;
            font-weight: bold;
            color: #111827;
        }

        /* CONTROLS */

        .controls {
            background: white;

            padding: 20px;

            border-radius: 14px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .search-box {
            width: 350px;
        }

        .search-box input {
            width: 100%;

            padding: 12px 16px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 14px;

            outline: none;
        }

        .search-box input:focus {
            border-color: #6366f1;
        }

        .refresh-btn {
            border: none;

            background: #4f46e5;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #4338ca;
        }

        /* TABLE CONTAINER */

        .table-container {
            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .table-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 24px;

            border-bottom: 1px solid #e5e7eb;
        }

        .table-header h2 {
            font-size: 20px;
        }

        .lead-count {
            color: #6b7280;

            font-size: 14px;
        }

        /* TABLE */

        table {
            width: 100%;

            border-collapse: collapse;
        }

        thead {
            background: #f9fafb;
        }

        th {
            text-align: left;

            padding: 15px 20px;

            font-size: 13px;

            color: #6b7280;

            font-weight: 600;

            border-bottom:
                1px solid #e5e7eb;
        }

        td {
            padding: 16px 20px;

            font-size: 14px;

            border-bottom:
                1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        /* STATUS */

        .status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }

        .status-new {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-hot {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-warm {
            background: #fef3c7;
            color: #d97706;
        }

        .status-follow-up {
            background: #ede9fe;
            color: #7c3aed;
        }

        .status-converted {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-lost {
            background: #e5e7eb;
            color: #4b5563;
        }

        /* LOADING */

        .loading {
            text-align: center;

            padding: 40px;

            color: #6b7280;
        }

        /* MOBILE */

        @media (max-width: 1000px) {

            .kpi-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 900px;
            }

        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;

                align-items: stretch;

                gap: 15px;
            }

            .search-box {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <section id="authScreen" class="auth-screen">

        <form id="authForm" class="auth-card">

            <h1>Welcome back</h1>

            <p>Sign in to access your lead dashboard.</p>

            <label class="auth-field">
                Username
                <input id="authUsername" type="text" autocomplete="username" required>
            </label>

            <label class="auth-field">
                Password
                <input id="authPassword" type="password" autocomplete="current-password" required>
            </label>

            <p id="authError" class="auth-error" role="alert"></p>

            <button class="auth-submit" type="submit">Sign In</button>

        </form>

    </section>

    <div id="dashboard" class="container" hidden>


        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>
                    Lead Dashboard
                </h1>

                <p>
                    Monitor and manage your leads
                </p>

            </div>

            <div class="header-actions">
                <button id="logoutBtn" class="logout-btn" type="button">Log Out</button>

                <div
                    id="connectionStatus"
                    class="connection-status"
                >
                    Connecting...
                </div>
            </div>

        </div>


        <!-- KPI CARDS -->

        <div class="kpi-grid">

            <div class="kpi-card">
                <div class="kpi-title">Total Leads</div>
                <div id="totalLeads" class="kpi-value">0</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">Active Leads</div>
                <div id="activeLeads" class="kpi-value">0</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">Leads Per Day</div>
                <div id="leadsPerDay" class="kpi-value">0</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-title">Revenue</div>
                <div id="totalRevenue" class="kpi-value">$0</div>
            </div>

        </div>


        <!-- SEARCH + REFRESH -->

        <div class="controls">


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search leads..."
                >

            </div>


            <button
                id="refreshBtn"
                class="refresh-btn"
            >
                ↻ Refresh Leads
            </button>


        </div>


        <!-- LEADS TABLE -->

        <div class="table-container">


            <div class="table-header">

                <h2>
                    All Leads
                </h2>

                <span
                    id="leadCount"
                    class="lead-count"
                >
                    0 leads
                </span>

            </div>


            <table>


                <thead>

                    <tr>

                        <th>
                            Full Name
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Leads Per Day
                        </th>

                    </tr>

                </thead>


                <tbody id="leadsTable">

                    <tr>

                        <td
                            colspan="7"
                            class="loading"
                        >
                            Loading leads...
                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


    <!-- ONLY ONE JAVASCRIPT FILE -->

    <script src="script.js"></script>

</body>

</ht
